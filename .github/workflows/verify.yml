name: verify

on:
  push:
    branches: [main, 'feature/**', 'refactor/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --all-extras --frozen --python 3.11
      - name: Run verification pipeline
        run: uv run make verify
