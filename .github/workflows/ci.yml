name: CI

on:
  push:
    branches: [ main, feature/*, refactor/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Install dependencies
      run: uv sync --all-extras --frozen --python 3.12
    
    - name: Run linting
      run: uv run make lint

    - name: Check formatting
      run: uv run make format-check
    
    - name: Run type checking
      run: uv run make type-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --all-extras --frozen --python ${{ matrix.python-version }}
    
    - name: Run unit tests
      run: uv run pytest tests/ -x --disable-warnings -m "not integration and not external"
    
    - name: Run deterministic integration tests
      run: uv run pytest tests/ -x --disable-warnings -m "integration"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Install dependencies
      run: uv sync --all-extras --frozen --python 3.12
    
    - name: Export runtime dependencies
      run: >-
        uv export --frozen --no-dev --no-emit-project --no-hashes
        --output-file "${{ runner.temp }}/artist-matrix-runtime-requirements.txt"

    - name: Run security audit
      run: >-
        uv run pip-audit
        --cache-dir "${{ runner.temp }}/pip-audit-cache"
        --requirement "${{ runner.temp }}/artist-matrix-runtime-requirements.txt"
