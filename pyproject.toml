[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artist-matrix"
version = "0.2.0"
description = "Codex-native agent system for virtual artist creation and release operations."
authors = [{ name = "Artist Matrix Maintainers" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "httpx>=0.28",
    "rich>=13.0",
    "openai-codex==0.147.0",
    "mcp>=1.29,<2",
]

[project.scripts]
artist-matrix = "artist_matrix.cli:main"
artist-matrix-mcp = "artist_matrix.agent_runtime.mcp_server:main"
artist-matrix-legacy = "artist_matrix.tui.__main__:legacy_main"

[tool.setuptools.package-data]
"artist_matrix.prompts.agents" = ["*.md"]
"artist_matrix.prompts.creation" = ["*.md"]
"artist_matrix.prompts.persona" = ["*.md"]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "pip-audit>=2.6",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: marks deterministic cross-component integration tests",
    "external: marks tests that require credentials or external services",
]
filterwarnings = [
    # Suppress external library warnings that we can't control
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::UserWarning:rich.live",
    # Allow our own deprecation warnings to show (for datetime fixes we just made)
    "default::DeprecationWarning:artist_matrix.*"
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
